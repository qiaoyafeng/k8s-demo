{{/*
Secret：承载敏感配置 LLM_API_KEY
- b64enc 把明文编码为 base64（注意：Secret 是编码不是加密，
  集群内有权限者仍可解码，生产环境建议结合外部密钥管理方案）；
- apiKey 为空时依旧创建空 Secret，避免 Deployment envFrom 引用失败；
  安装后 NOTES.txt 会提醒配置密钥。
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-demo.fullname" . }}-secret
  labels:
    {{- include "k8s-demo.labels" . | nindent 4 }}
type: Opaque
data:
  LLM_API_KEY: {{ .Values.llm.apiKey | b64enc | quote }}

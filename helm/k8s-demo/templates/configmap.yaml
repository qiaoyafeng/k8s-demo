{{/* ConfigMap：非敏感配置（与 K8s 原生部署的 ConfigMap 语义一致） */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-demo.fullname" . }}-config
  labels:
    {{- include "k8s-demo.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.appEnv | quote }}
  TZ: {{ .Values.timezone | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  LLM_TIMEOUT: {{ .Values.llm.timeout | quote }}

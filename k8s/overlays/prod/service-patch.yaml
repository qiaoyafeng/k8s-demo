# 生产环境：把 Service 从 ClusterIP 改为 NodePort
# NodePort 会为 Service 分配一个 30000-32767 的固定端口，
# 通过任意节点 IP + 该端口即可从集群外访问。
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo
spec:
  type: NodePort
  ports:
    - name: http
      port: 8000
      targetPort: http
      # 指定固定 nodePort，便于防火墙/文档引用；省略则随机分配
      nodePort: 30080

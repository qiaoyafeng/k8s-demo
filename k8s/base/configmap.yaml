# ============================================================
# ConfigMap：承载非敏感配置（明文可读）
#
# 教学要点：ConfigMap 与 Secret 的分工
# - ConfigMap 存"不敏感但经常变"的配置：Base URL、模型名、超时等；
# - Secret 存敏感信息（LLM_API_KEY），单独创建，不进 git（见 README）。
#
# 各环境会通过 overlay 的 patch 覆盖这里的 APP_ENV 等字段。
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-demo-config
  labels:
    app: k8s-demo
data:
  # 环境标识：dev/test/prod 由 overlay patch 覆盖
  APP_ENV: "dev"
  # 时区
  TZ: "Asia/Shanghai"
  # ---- LLM 非敏感配置（敏感密钥放 Secret）----
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  LLM_TIMEOUT: "60"

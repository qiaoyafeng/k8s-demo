# ============================================================
# Service：为 Pod 集合提供稳定的访问入口 + 负载均衡
#
# 教学要点：
# - Pod 是"易逝"的（重建后 IP 会变），Service 提供不变的
#   虚拟 IP（ClusterIP）与 DNS 名，客户端只管访问 Service；
# - selector 按标签把流量转发给 app=k8s-demo 的 Pod，
#   默认 iptables/IPVS 轮询 —— 反复请求 /api/node/name
#   会看到不同 Pod 名，直观感受负载均衡；
# - 三种类型对比（base 为 ClusterIP，prod overlay 改为 NodePort）：
#   ClusterIP    仅集群内可访问（最安全，默认）
#   NodePort     每个节点开固定端口对外（30000-32767）
#   LoadBalancer 云厂商分配公网 LB（生产常用，需云环境）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo
  labels:
    app: k8s-demo
spec:
  type: ClusterIP
  selector:
    app: k8s-demo
  ports:
    - name: http
      port: 8000        # Service 对外端口
      targetPort: http  # 转发到 Pod 的 http 端口（containerPort 8000）

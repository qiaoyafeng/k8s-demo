# ============================================================
# Docker Compose 基础定义（test / prod 环境共用）
#
# 配置来源：同目录 .env 文件（cp .env.example .env 后填写）
# 教学要点：
# - environment 用 ${VAR} 引用宿主机 .env，密钥不写进本文件；
# - 开发环境请叠加 docker-compose.dev.yml：
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# ============================================================

services:
  k8s-demo:
    # 本地学习用 build；如果已有推送的镜像，可换成 image: <仓库>/k8s-demo:latest
    build:
      context: .
    image: k8s-demo:latest
    container_name: k8s-demo
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ${VAR:-默认值}：.env 未定义时回退到默认值
      APP_ENV: ${APP_ENV:-dev}
      TZ: ${TZ:-Asia/Shanghai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      # 敏感信息：来自 .env（已 gitignore），绝不写死在 compose 文件
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}

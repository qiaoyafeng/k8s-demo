[project]
name = "k8s-demo"
version = "1.0.0"
description = "FastAPI 教学示例：Kubernetes 与 Helm Chart 学习项目"
readme = "README.md"
requires-python = ">=3.11"
# 依赖锁定与安装统一由 uv 管理（uv.lock），不再使用 requirements.txt。
# 本地开发：uv sync；运行：uv run uvicorn app.main:app --reload
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.55",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
# 仅开发 / 测试需要：uv sync 默认安装全部；镜像构建用 --no-dev 跳过。
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
# 本项目是扁平应用（无 src 布局、不发布到 PyPI），
# 关闭打包构建，让 Docker 构建与本地运行都更简单。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# package=false 模式下项目根目录不在 sys.path，需显式声明
pythonpath = ["."]
